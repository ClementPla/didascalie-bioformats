name: release

# Pushing a tag such as v0.1.0 builds the program for every platform
# Didascalie ships on and attaches the binaries to a GitHub release:
#   didascalie-bioformats-<target-triple>[.exe]
# named the way Tauri's `externalBin` expects. Didascalie's release workflow
# downloads them from a pinned tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          # The oldest glibc Didascalie's Linux build supports.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: name the binary for Tauri
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/didascalie-bioformats${{ matrix.ext }}" \
             "dist/didascalie-bioformats-${{ matrix.target }}${{ matrix.ext }}"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  licence:
    # The GPL text travels with the binaries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: LICENSE
